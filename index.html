.roll-stage.critical{position:relative;isolation:isolate;border:2px solid #ffb15c!important;animation:ae-crit-aura 2.4s ease-in-out infinite}
.roll-stage.critical .roll-number,.roll-stage.critical .die b,.history-card.critical .history-total{color:#ffd46b!important;-webkit-text-fill-color:#ffd46b!important;background:none!important;background-image:none!important;-webkit-background-clip:border-box!important;text-shadow:2px 0 #ff5276,-2px 0 #3cdbff,0 0 12px #ffa158,0 0 24px #ad76ff;animation:ae-crit-text 2s ease-in-out infinite!important}
@keyframes ae-crit-text{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(120deg) brightness(1.4)}}
@keyframes ae-crit-aura{0%,100%{box-shadow:0 0 19px #ff5f8099,0 0 35px #41caff55,inset 0 0 25px #af59ff44}50%{box-shadow:0 0 30px #ffce69aa,0 0 55px #546dff88,inset 0 0 45px #46ccff66}}
.roll-impact.good{background:radial-gradient(circle at center,#fff5cf5c,#f56d7860 20%,#8155ed55 42%,#24ccef4b 68%,#f35a9b25 85%,transparent)!important}
.roll-impact.good:before{content:"";position:absolute;inset:-40%;background:conic-gradient(#ff517b75,#ffd45c6b,#6affb36b,#4ab7ff88,#b36cff77,#ff517b75);mix-blend-mode:screen;animation:ae-crit-burst 1.15s ease-out both}
.roll-impact.good:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,#ffffffdd,transparent 23%);animation:ae-crit-flash .65s ease-out both}
.roll-impact.good svg{position:relative;z-index:1;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 9px #e273ff)}
@keyframes ae-crit-burst{0%{opacity:0;transform:scale(.3) rotate(-30deg)}18%{opacity:.85}100%{opacity:0;transform:scale(1.3) rotate(30deg)}}
@keyframes ae-crit-flash{0%{opacity:0}14%{opacity:.9}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.roll-stage.critical,.roll-stage.critical .roll-number,.roll-stage.critical .die b,.history-card.critical .history-total{animation:none!important}}
.reduce-motion .roll-stage.critical,.reduce-motion .roll-stage.critical .roll-number,.reduce-motion .roll-stage.critical .die b,.reduce-motion .history-card.critical .history-total{animation:none!important}

.modal-exit.modal-configure{background:var(--theme-raised)!important;color:var(--theme-text)!important;border-color:var(--theme-cold)!important;min-width:118px}
.history-configured{display:inline-flex;align-items:center;border:1px solid #8dcdfb;background:rgba(44,160,224,.16);color:#a8e5ff;padding:3px 7px;font-size:11px;font-weight:900;letter-spacing:.06em}

.history-rerolled{display:inline-flex;align-items:center;gap:4px;border:1px solid #ffac3b;background:rgba(255,154,30,.13);color:#ffbc61;padding:3px 7px;font-size:11px;font-weight:900;letter-spacing:.06em}
</style>
