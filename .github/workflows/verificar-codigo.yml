name: Verificação de integridade
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe de todos os módulos JavaScript
        run: |
          for f in ./*.js ./discord-bot/*.mjs ./scripts/*.mjs; do
            node --check "$f"
          done
      - name: Auditar estrutura de recursos publicados
        run: node scripts/audit-static.mjs --report
      - name: Testar dados e segurança do bot
        run: node --test discord-bot/test.mjs
      - name: Testar interface e recursos
        run: node --test tests/*.test.mjs
      - name: Validar separação do HTML
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const html=fs.readFileSync("index.html","utf8");
          for(const file of ["arquivo-base.css","arquivo-recursos.css","arquivo-app.js"]){
            if(!fs.statSync(file).size || !html.includes(file))throw Error("Recurso inválido: "+file);
          }
          if(html.length>20000)throw Error("HTML voltou a incorporar blocos muito grandes");
          '
